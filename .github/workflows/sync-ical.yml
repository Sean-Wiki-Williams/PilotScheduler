name: Sync iCloud flight calendar

on:
  schedule:
    - cron: "*/20 * * * *"  # every 20 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest iCal feed
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: |
          curl -sSL -A "Mozilla/5.0 DadTravelTracker/1.0" "$ICAL_URL" -o flight_calendar.ics
          test -s flight_calendar.ics

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flight_calendar.ics
          if git diff --cached --quiet -- flight_calendar.ics; then
            echo "No changes to commit"
          else
            git commit -m "Sync flight calendar $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
